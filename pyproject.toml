[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-orphan"
version = "0.1.0"
description = "Find asset files that are never referenced in source code."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "asset-orphan contributors" }]

[project.scripts]
asset-orphan = "asset_orphan.cli:main"
